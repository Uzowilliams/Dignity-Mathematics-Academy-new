<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Dashboard — Dignity Mathematics Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Fredoka:wght@600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal-style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="portal-header">
  <div class="portal-brand">
    <div class="portal-badge">D</div>
    <span class="name">Dignity Mathematics Academy — Parent Portal</span>
  </div>
  <a href="../index.html" class="back">← Back to Website</a>
</header>

<div class="portal-wrap">
  <div class="dash-topbar">
    <div>
      <h1>Welcome</h1>
      <div class="who" id="whoami">Loading...</div>
    </div>
    <button class="btn-outline" id="logoutBtn">Sign Out</button>
  </div>

  <div class="card">
    <h2>My Children</h2>
    <div id="childrenList"><p class="placeholder-note">Loading...</p></div>
  </div>

  <div class="card">
    <h2>Results</h2>
    <div id="resultsWrap"><p class="placeholder-note">Loading...</p></div>
  </div>

  <div class="card">
    <h2>Fees</h2>
    <p class="placeholder-note">Coming in Phase 3 — view fee balance and payment history here.</p>
  </div>

  <div class="card">
    <h2>Announcements</h2>
    <div id="annList"><p class="placeholder-note">Loading announcements...</p></div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
  (async () => {
    const profile = await requireLogin('parent', 'parent-login.html');
    if (!profile) return;
    document.getElementById('whoami').textContent =
      `Signed in as ${profile.full_name || 'Parent'}`;
    loadAnnouncements();
    loadChildrenAndResults();
  })();

  document.getElementById('logoutBtn').addEventListener('click', () => {
    logout('parent-login.html');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function loadAnnouncements() {
    const listEl = document.getElementById('annList');
    const { data, error } = await supabaseClient
      .from('announcements')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<p class="placeholder-note">Could not load announcements.</p>`;
      return;
    }
    if (!data || data.length === 0) {
      listEl.innerHTML = `<p class="placeholder-note">No announcements yet.</p>`;
      return;
    }
    listEl.innerHTML = data.map(a => `
      <div style="border-bottom:1px solid var(--paper-dim);padding:16px 0;">
        <strong style="font-size:15.5px;">${escapeHtml(a.title)}</strong>
        <div style="font-size:12.5px;color:#8a8d93;margin-top:2px;">${formatDate(a.created_at)}</div>
        <p style="margin:10px 0 0;font-size:14.5px;color:#4a4d54;white-space:pre-wrap;">${escapeHtml(a.body)}</p>
      </div>
    `).join('');
  }

  async function loadChildrenAndResults() {
    const childrenEl = document.getElementById('childrenList');
    const resultsEl = document.getElementById('resultsWrap');

    const { data: children, error } = await supabaseClient
      .from('students')
      .select('*')
      .order('full_name', { ascending: true });

    if (error) {
      childrenEl.innerHTML = `<p class="placeholder-note">Could not load your children's records.</p>`;
      resultsEl.innerHTML = '';
      return;
    }
    if (!children || children.length === 0) {
      childrenEl.innerHTML = `<p class="placeholder-note">No children linked to your account yet. Contact the school office if this seems wrong.</p>`;
      resultsEl.innerHTML = `<p class="placeholder-note">No children linked yet.</p>`;
      return;
    }

    childrenEl.innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Admission No.</th><th>Program</th></tr></thead>
        <tbody>
          ${children.map(c => `
            <tr><td>${escapeHtml(c.full_name)}</td><td>${escapeHtml(c.admission_number)}</td><td>${escapeHtml(c.program)}</td></tr>
          `).join('')}
        </tbody>
      </table>
    `;

    const childIds = children.map(c => c.id);
    const { data: results, error: resError } = await supabaseClient
      .from('results')
      .select('*')
      .in('student_id', childIds)
      .order('session', { ascending: false })
      .order('term', { ascending: true });

    if (resError) {
      resultsEl.innerHTML = `<p class="placeholder-note">Could not load results.</p>`;
      return;
    }
    if (!results || results.length === 0) {
      resultsEl.innerHTML = `<p class="placeholder-note">No results recorded yet.</p>`;
      return;
    }

    const childNameById = Object.fromEntries(children.map(c => [c.id, c.full_name]));

    resultsEl.innerHTML = `
      <table>
        <thead><tr><th>Child</th><th>Session</th><th>Term</th><th>Subject</th><th>Score</th><th>Grade</th><th>Remarks</th></tr></thead>
        <tbody>
          ${results.map(r => `
            <tr>
              <td>${escapeHtml(childNameById[r.student_id] || 'Unknown')}</td>
              <td>${escapeHtml(r.session)}</td>
              <td>${escapeHtml(r.term)}</td>
              <td>${escapeHtml(r.subject)}</td>
              <td>${r.score ?? '-'}</td>
              <td>${escapeHtml(r.grade || '-')}</td>
              <td>${escapeHtml(r.remarks || '-')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }
</script>

</body>
</html>
